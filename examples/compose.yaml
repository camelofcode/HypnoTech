services:
  mongo:
    image: docker.io/library/mongo:8.0.32
    container_name: hypnotech-demo-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - hypnotech-demo-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hypnotech-demo-mongo:
